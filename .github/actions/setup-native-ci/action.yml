name: Setup native CI environment
description: Restore ccache, install dependencies, and initialize ccache

inputs:
  cache-key:
    description: ccache-v2 key prefix identifying the platform, compiler, and build configuration
    required: true
  install-clang:
    description: Whether to install clang
    required: false
    default: "false"
  install-lcov:
    description: Whether to install lcov
    required: false
    default: "false"
  ccache-max-size:
    description: Max ccache size
    required: false
    default: "2G"

runs:
  using: composite
  steps:
    - name: Set cache keys
      id: cache-key
      shell: bash
      env:
        CACHE_PREFIX: ${{ inputs.cache-key }}
        CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      run: |
        {
          echo "key=${CACHE_PREFIX}-${CACHE_SCOPE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "restore=${CACHE_PREFIX}-${CACHE_SCOPE}-"
          echo "main=${CACHE_PREFIX}-main-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore ccache
      # The cache action saves this run's key after a successful job.
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.cache-key.outputs.restore }}
          ${{ steps.cache-key.outputs.main }}

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo ./install_deps.sh

    - name: Install lcov
      if: ${{ inputs.install-lcov == 'true' }}
      shell: bash
      run: sudo apt-get install -y lcov

    - name: Install clang
      if: ${{ inputs.install-clang == 'true' }}
      shell: bash
      run: sudo apt-get install -y clang

    - name: Configure ccache
      shell: bash
      run: |
        ccache --set-config=max_size=${{ inputs.ccache-max-size }}
        ccache -z
