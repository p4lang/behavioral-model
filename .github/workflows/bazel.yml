name: "Test Bazel Build"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BAZEL: bazelisk-linux-amd64
      BUILDIFIER: buildifier-linux-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Identify runner image
        id: runner-image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Set cache keys
        id: cache-key
        env:
          CACHE_PREFIX: bazel-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('.bazelversion') }}-build
          CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
        run: |
          {
            echo "key=${CACHE_PREFIX}-${CACHE_SCOPE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "restore=${CACHE_PREFIX}-${CACHE_SCOPE}-"
            echo "main=${CACHE_PREFIX}-main-"
          } >> "$GITHUB_OUTPUT"

      - name: Mount bazel cache
        uses: actions/cache/restore@v6
        with:
          # See https://docs.bazel.build/versions/master/output_directories.html
          path: "~/.cache/bazel"
          # The full cache includes the detected local C/C++ toolchain. Only
          # reuse it on the same runner image and with the same Bazel version.
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.restore }}
            ${{ steps.cache-key.outputs.main }}

      - name: Install Buildifier
        run: |
          curl -LO "https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/$BUILDIFIER"
          chmod +x $BUILDIFIER
          sudo mv $BUILDIFIER /usr/local/bin/buildifier

      - name: Run Buildifier
        run: |
          BZL_FILES=$(git ls-files | grep -E 'BUILD.*|\.bzl$|\.bazel$')
          if ! buildifier --mode=check $BZL_FILES; then
            echo "::error::Buildifier formatting issues found."
            echo "::group::Buildifier Diff"
            buildifier --mode=diff $BZL_FILES
            echo "::endgroup::"
            exit 1
          else
            echo "All files are formatted correctly."
          fi

      - name: Install bazelisk
        run: |
          curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/$BAZEL"
          chmod +x $BAZEL
          sudo mv $BAZEL /usr/local/bin/bazel

      - name: Build
        run: bazel build //targets/simple_switch_grpc:simple_switch_grpc

      - name: Test
        run: |
          bazel test //targets/simple_switch/tests/...
          bazel test //targets/simple_switch_grpc/tests/...

      - name: Save bazel cache
        uses: actions/cache/save@v6
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
        with:
          path: "~/.cache/bazel"
          key: ${{ steps.cache-key.outputs.key }}
